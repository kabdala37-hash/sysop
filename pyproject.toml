[project]
name = "sysop-agent"
version = "0.1.0"
description = "Agente observador de servidores y plataformas Acme"
requires-python = ">=3.11"
# Sin fastapi, uvicorn ni jinja2: el panel web se dio de baja el 2026-08-28 y
# la salida es correo y terminal. Menos superficie que actualizar y un puerto
# menos abierto en cada servidor observado.
dependencies = [
    "mysql-connector-python>=9.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
sysop-agent = "sysop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sysop*"]

[tool.setuptools.package-data]
"sysop.store" = ["schema.sql"]
